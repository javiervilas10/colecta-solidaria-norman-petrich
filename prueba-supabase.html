<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Colecta Solidaria - Prueba</title>
</head>
<body>
<h1>Colecta Solidaria Norman PETRICH</h1>
<p>Con un cafecito por mes podemos hacer la diferencia.</p>
<p id="estado">Comprobando conexión...</p>
<script>
const url = "https://ywlfksepetmdgnibmvwr.supabase.co";
const clave = "sb_publishable_vFirVXhQgLM9Z33VSwkGmg_fga2AmZH";

fetch(url + "/rest/v1/donaciones?select=id&limit=0", {
  headers: { apikey: clave }
})
.then(async respuesta => {
  document.getElementById("estado").textContent =
    "Servidor respondió: " + respuesta.status +
    (respuesta.ok ? " - Conexión correcta" : " - " + await respuesta.text());
})
.catch(error => {
  document.getElementById("estado").textContent =
    "Error de conexión: " + error.message;
});
</script>
</body>
