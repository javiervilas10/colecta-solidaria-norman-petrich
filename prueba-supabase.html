<p id="estado"></p>

<script>
const url = "https://ywlfksepetmdgnibmvwr.supabase.co";
const clave = "sb_publishable_vFirVXhQgLM9Z33VSwkGmg_fga2AmZH";

async function registrar() {

        autoriza_whatsapp: false

      estado.textContent = "Aporte ficticio registrado correctamente. Pendiente de aprobacion.";
    } else {
      estado.textContent = "Error " + respuesta.status + ": " + await respuesta.text();
    }
  } catch (error) {
    estado.textContent = "Error de conexion: " + error.message;
  }
}
</script>
